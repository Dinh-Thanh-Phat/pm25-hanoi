# Mỗi 30 phút: lấy số đo + dự báo thời tiết mới → chạy mô hình → xuất trang tĩnh → deploy Vercel.
# 01:30 giờ VN (18:30 UTC): tải bù số đo, cập nhật nhánh `data` để phần lịch sử dài thêm.
name: cap-nhat-so-lieu
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tai_bu:
        description: "Tải bù số đo (như chạy đêm)"
        type: boolean
        default: false
concurrency:
  group: cap-nhat
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Tải bù số đo (giờ 18 UTC = 01 giờ VN, hoặc khi bấm chạy tay có chọn)
        if: ${{ inputs.tai_bu || github.event_name == 'schedule' }}
        run: |
          if [ "${{ inputs.tai_bu }}" = "true" ] || [ "$(date -u +%H)" = "18" ]; then python -m pm25.fetch update; fi
      - name: Xuất trang tĩnh
        run: python tools/build_static.py
      - name: Deploy Vercel
        run: npx -y vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
      - name: Lưu số đo mới vào nhánh data
        working-directory: data
        run: |
          git config user.name "pm25-bot"
          git config user.email "pm25-bot@users.noreply.github.com"
          git add raw outputs/history.json
          git diff --cached --quiet || (git commit -m "số đo đến $(date -u +%F)" && git push)
